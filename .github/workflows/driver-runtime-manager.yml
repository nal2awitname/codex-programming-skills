name: Driver & Runtime Manager
on:
  push:
    paths:
      - 'skills/windows-driver-runtime-manager/**'
      - '.github/workflows/driver-runtime-manager.yml'
  pull_request:
    paths:
      - 'skills/windows-driver-runtime-manager/**'
      - '.github/workflows/driver-runtime-manager.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logic-and-links:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
        working-directory: skills/windows-driver-runtime-manager
    steps:
      - uses: actions/checkout@v4
      - name: Pester (cross-platform logic)
        timeout-minutes: 10
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests'; $c.Run.Exit = $true; $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
      - name: PSScriptAnalyzer (no errors or warnings)
        timeout-minutes: 10
        run: |
          Install-Module PSScriptAnalyzer -MinimumVersion 1.21 -Force -Scope CurrentUser
          $r = @(Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings ./PSScriptAnalyzerSettings.psd1)
          $r | Format-Table ScriptName, Line, Severity, RuleName, Message -AutoSize -Wrap | Out-String -Width 250 | Write-Host
          if ($r.Count) { throw "$($r.Count) analyzer finding(s)" }
      - name: Official Microsoft download links resolve
        run: |
          $cat = Get-Content scripts/catalog.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $urls = $cat.items | ForEach-Object { $_.install } | Where-Object { $_.type -eq 'direct' } | ForEach-Object { $_.url } | Sort-Object -Unique
          $bad = 0
          foreach ($u in $urls) {
            try { $r = Invoke-WebRequest -Uri $u -Method Head -MaximumRedirection 10 -UseBasicParsing -TimeoutSec 60; Write-Host ("{0} {1}" -f $r.StatusCode, $u) }
            catch { $bad++; Write-Host ("FAIL {0}: {1}" -f $u, $_.Exception.Message) }
          }
          Import-Module ./scripts/DriverRuntimeManager.psm1 -Force
          foreach ($ch in @(Get-DrmDotnetChannels -Catalog $cat)) {
            foreach ($a in 'x64', 'x86') {
              $u = $cat.dotnet.downloadUrlTemplate.Replace('{version}', $ch.Latest).Replace('{arch}', $a)
              try { $r = Invoke-WebRequest -Uri $u -Method Head -UseBasicParsing -TimeoutSec 60; Write-Host ("{0} {1}" -f $r.StatusCode, $u) }
              catch { $bad++; Write-Host ("FAIL {0}: {1}" -f $u, $_.Exception.Message) }
            }
            # DRM-107: releases.json ของช่องต้องมีไฟล์ windowsdesktop + SHA512 ของรุ่นล่าสุด และอยู่บนโฮสต์ที่เชื่อถือ
            try {
              $rel = Invoke-RestMethod -Uri $ch.ReleasesJson -TimeoutSec 120
              foreach ($a in 'x64', 'x86', 'arm64') {
                $f = Select-DrmDotnetFile -Releases $rel -Arch $a -Version $ch.Latest
                if (-not $f -or $f.Sha512 -notmatch '^[0-9A-F]{128}$' -or @($cat.trustedRuntimeHosts) -notcontains ([Uri]$f.Url).Host) { $bad++; Write-Host ("FAIL releases.json {0} {1}" -f $ch.Channel, $a) }
                else { Write-Host ("OK   {0} sha512 {1}..." -f $f.Url, $f.Sha512.Substring(0, 16)) }
              }
            } catch { $bad++; Write-Host ("FAIL {0}: {1}" -f $ch.ReleasesJson, $_.Exception.Message) }
          }
          foreach ($u in 'https://hpia.hpcloud.hp.com/ref/platformList.cab') {
            try { $r = Invoke-WebRequest -Uri $u -Method Head -UseBasicParsing -TimeoutSec 60; Write-Host ("{0} {1}" -f $r.StatusCode, $u) }
            catch { $bad++; Write-Host ("FAIL {0}: {1}" -f $u, $_.Exception.Message) }
          }
          if ($bad) { throw "$bad link(s) failed" }

  windows:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: skills/windows-driver-runtime-manager
    steps:
      - uses: actions/checkout@v4
      - name: Pester (Windows, including real-system tests)
        timeout-minutes: 15
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.5
          $c = New-PesterConfiguration
          $c.Run.Path = 'tests'; $c.Run.Exit = $true; $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
      - name: SelfTest — WPF window, controls and catalog
        timeout-minutes: 5
        run: |
          $exe = if ($PSVersionTable.PSEdition -eq 'Desktop') { 'powershell.exe' } else { 'pwsh.exe' }
          & $exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/DriverRuntimeManager.ps1 -Mode SelfTest
          if ($LASTEXITCODE -ne 0) { throw "SelfTest failed ($LASTEXITCODE)" }
      - name: GUI smoke test — real window, background scan, update check, presets, dry-run install
        timeout-minutes: 30
        run: |
          $exe = if ($PSVersionTable.PSEdition -eq 'Desktop') { 'powershell.exe' } else { 'pwsh.exe' }
          $root = "$env:RUNNER_TEMP\drm-${{ matrix.shell }}\gui"
          $json = "$env:RUNNER_TEMP\drm-${{ matrix.shell }}\gui-smoke.json"
          New-Item -ItemType Directory -Force -Path (Split-Path $json) | Out-Null
          & $exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/DriverRuntimeManager.ps1 -Mode Gui -NoElevate -ShowConsole -SmokeTestSeconds 1500 -SmokeTestReport $json -Root $root
          if (-not (Test-Path $json)) { throw "GUI smoke test wrote no result (exit $LASTEXITCODE)" }
          $r = Get-Content $json -Raw -Encoding UTF8 | ConvertFrom-Json
          $r | Format-List | Out-String -Width 250 | Write-Host
          if ($r.TimedOut) { throw "GUI smoke test timed out in phase $($r.Phase)" }
          if ($r.Devices -lt 10 -or $r.Runtimes -lt 10 -or $r.SystemRows -lt 15) { throw 'GUI grids were not populated' }
          if ($r.PlanItems -lt 1 -or $r.Results -ne $r.PlanItems) { throw "Dry-run install from the window did not complete ($($r.Results)/$($r.PlanItems))" }
          if (@($r.Failed).Count) { throw ("Failed items: " + ($r.Failed -join '; ')) }
          if ($r.ProfileBefore -lt 1 -or $r.ProfileBefore -ne $r.ProfileAfter) { throw "Selection profile round trip changed the selection ($($r.ProfileBefore) -> $($r.ProfileAfter))" }
          if (-not $r.Diagnostics -or -not (Test-Path $r.Diagnostics)) { throw 'Diagnostics bundle from the window was not created' }
          if ($r.Title -notmatch [regex]::Escape("v$($r.Version)")) { throw 'Window title does not show the version' }
      - name: Diagnostics bundle (CLI) is complete and hides identifiers
        timeout-minutes: 10
        run: |
          $exe = if ($PSVersionTable.PSEdition -eq 'Desktop') { 'powershell.exe' } else { 'pwsh.exe' }
          $root = "$env:RUNNER_TEMP\drm-${{ matrix.shell }}\diag"
          & $exe -NoProfile -ExecutionPolicy Bypass -File scripts/DriverRuntimeManager.ps1 -Mode Diagnose -SinceHours 2 -NoElevate -Root $root
          if ($LASTEXITCODE -ne 0) { throw "Diagnose failed ($LASTEXITCODE)" }
          $zip = Get-ChildItem "$root\Reports" -Filter 'DRM_Diagnostics_*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'No diagnostics zip' }
          $out = Join-Path $env:RUNNER_TEMP 'drm-diag-check-${{ matrix.shell }}'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $out -Force
          foreach ($f in 'summary.txt', 'devices.csv', 'setupapi-dev-tail.log', 'events-pnp-configuration.txt', 'pnputil-enum-drivers.txt', 'README.txt') { if (-not (Test-Path (Join-Path $out $f))) { throw "Missing $f" } }
          $leak = Get-ChildItem $out -File | Select-String -SimpleMatch $env:COMPUTERNAME -List
          if ($leak) { throw ("Computer name not redacted in: " + (($leak | ForEach-Object { $_.Filename }) -join ', ')) }
          Get-Content (Join-Path $out 'summary.txt') -TotalCount 25 -Encoding UTF8 | Write-Host
      - name: Launcher from a folder with spaces and parentheses
        if: matrix.shell == 'powershell'
        timeout-minutes: 5
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Driver Tools (1)'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item scripts\* $dir -Recurse -Force
          $env:DRM_NO_PAUSE = '1'
          $p = Start-Process -FilePath (Join-Path $dir 'Start-DriverRuntimeManager.cmd') -ArgumentList '-Mode', 'SelfTest', '-NoElevate' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "Launcher SelfTest failed ($($p.ExitCode))" }
      - name: Detailed system scan with update check (manufacturer, then Windows Update)
        timeout-minutes: 25
        run: |
          $exe = if ($PSVersionTable.PSEdition -eq 'Desktop') { 'powershell.exe' } else { 'pwsh.exe' }
          & $exe -NoProfile -ExecutionPolicy Bypass -File scripts/DriverRuntimeManager.ps1 -Mode Scan -CheckUpdates -NoElevate -Root "$env:RUNNER_TEMP\drm-${{ matrix.shell }}\scan"
          if ($LASTEXITCODE -ne 0) { throw "Scan failed ($LASTEXITCODE)" }
          if (-not (Get-ChildItem "$env:RUNNER_TEMP\drm-${{ matrix.shell }}\scan\Reports" -Filter *.html)) { throw 'No HTML report' }
          # Windows Update search must really finish, through the asynchronous path that has a timeout (DRM-127).
          # ASCII-only patterns: Windows PowerShell 5.1 reads this inline script as ANSI, so Thai literals here never match.
          $log = Get-ChildItem "$env:RUNNER_TEMP\drm-${{ matrix.shell }}\scan\Logs" -Filter 'DRM_*.log' | Sort-Object LastWriteTime | Select-Object -Last 1
          $text = Get-Content $log.FullName -Raw -Encoding UTF8
          ($text -split "`n" | Select-String -Pattern 'Windows Update|wu-search|asynchronous') | ForEach-Object { Write-Host $_.Line.Trim() }
          if ($text -notmatch '\[OK\s+\] Windows Update ') { throw 'Windows Update search did not complete' }
          if ($text -notmatch '\[wu-search:async\]' -or $text -match '\[wu-search:sync\]') { throw 'Windows Update search did not use the asynchronous path with a timeout' }
      - name: Dry run of every item in the correct order
        timeout-minutes: 25
        run: |
          $exe = if ($PSVersionTable.PSEdition -eq 'Desktop') { 'powershell.exe' } else { 'pwsh.exe' }
          & $exe -NoProfile -ExecutionPolicy Bypass -File scripts/DriverRuntimeManager.ps1 -Mode Install -Preset all -IncludeOem -IncludeWindowsUpdateDrivers -DryRun -NoElevate -Root "$env:RUNNER_TEMP\drm-${{ matrix.shell }}\dry"
          if ($LASTEXITCODE -ne 0) { throw "Dry run reported failures ($LASTEXITCODE)" }
      - name: Real install — download from Microsoft, verify signature, update only when newer
        if: matrix.shell == 'powershell'
        timeout-minutes: 30
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/DriverRuntimeManager.ps1 -Mode Install -Preset none -Items 'vc14-x64,vc14-x86,vc2013-x64,vc2010-x64,directx-jun2010,webview2,dotnet-desktop-10.0-x64' -NoRestorePoint -NoElevate -Root "$env:RUNNER_TEMP\drm-${{ matrix.shell }}\real"
          $code = $LASTEXITCODE
          $json = Get-ChildItem "$env:RUNNER_TEMP\drm-${{ matrix.shell }}\real\Reports" -Filter *.json | Sort-Object LastWriteTime | Select-Object -Last 1
          $report = Get-Content $json.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          $report.Results | Format-Table Name, Status, Method, ExitCode, Detail -AutoSize -Wrap | Out-String -Width 250 | Write-Host
          if ($code -ne 0) { throw "Real install reported failures ($code)" }
          # ต้องตรวจพบรันไทม์ที่ติดตั้งครบทั้ง 6 รายการ (DRM-019)
          $again = & powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Import-Module ./scripts/DriverRuntimeManager.psm1; `$c = Get-DrmCatalog -Path ./scripts/catalog.json; `$all = @(Get-DrmRuntimeItems -Catalog `$c -Offline); `$want = 'vc14-x64','vc14-x86','vc2013-x64','vc2010-x64','directx-jun2010','dotnet-desktop-10.0-x64'; 'found=' + @(`$all | Where-Object { `$want -contains `$_.Id -and `$_.Installed }).Count"
          Write-Host ($again -join ' ')
          if (($again | Select-Object -Last 1) -ne 'found=6') { throw "Not all installed runtimes are detected after install: $again" }
      - name: Second install pass reinstalls nothing (update only when newer)
        if: matrix.shell == 'powershell'
        timeout-minutes: 20
        run: |
          $root = "$env:RUNNER_TEMP\drm-${{ matrix.shell }}\real2"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/DriverRuntimeManager.ps1 -Mode Install -Items 'vc14-x64,vc14-x86,vc2013-x64,vc2010-x64,directx-jun2010,webview2,dotnet-desktop-10.0-x64' -NoRestorePoint -NoElevate -Root $root
          if ($LASTEXITCODE -ne 0) { throw "Second pass reported failures ($LASTEXITCODE)" }
          $json = Get-ChildItem "$root\Reports" -Filter *.json | Sort-Object LastWriteTime | Select-Object -Last 1
          $report = Get-Content $json.FullName -Raw -Encoding UTF8 | ConvertFrom-Json
          $report.Results | Format-Table Name, Status, Method, Detail -AutoSize -Wrap | Out-String -Width 250 | Write-Host
          $reinstalled = @($report.Results | Where-Object { $_.Status -ne 'UpToDate' })
          if ($reinstalled.Count) { throw ("Reinstalled although already current: " + (($reinstalled | ForEach-Object { '{0} ({1})' -f $_.Name, $_.Status }) -join '; ')) }
      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drm-${{ matrix.shell }}-reports
          path: |
            ${{ runner.temp }}\drm-${{ matrix.shell }}\**\*.log
            ${{ runner.temp }}\drm-${{ matrix.shell }}\**\*.html
            ${{ runner.temp }}\drm-${{ matrix.shell }}\**\*.json
          if-no-files-found: warn
