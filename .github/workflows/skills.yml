name: Skills 2.1 verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      VALUE_SCAN_REQUIRE_GUI: ${{ matrix.os == 'windows-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skills and run all test suites
        run: python -B scripts/check_repo.py --test
      - name: Run Value Scan demonstration
        working-directory: examples/value-scan-lab
        run: python -B scan_lab.py --demo
      - name: Verify Windows example launcher
        if: runner.os == 'Windows'
        shell: cmd
        working-directory: examples/rebuild-windows-from-behavior
        run: |
          call range_totals.cmd "{\"values\":[6,2,9]}" > launcher-result.json
          if errorlevel 1 exit /b 1
          python -c "import json,pathlib; actual=json.loads(pathlib.Path('launcher-result.json').read_text()); assert actual==dict(count=3,span=7,total=17),actual"
      - name: Verify installer preview and no-overwrite behavior
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'independent-rebuild-skill'
          & ./scripts/Install-WindowsBehaviorRebuild.ps1 -Destination $dest -WhatIf
          if (Test-Path -LiteralPath $dest) { throw 'WhatIf wrote files' }
          & ./scripts/Install-WindowsBehaviorRebuild.ps1 -Destination $dest
          if (-not (Test-Path (Join-Path $dest 'SKILL.md'))) { throw 'Skill missing' }
          $blocked = $false
          try { & ./scripts/Install-WindowsBehaviorRebuild.ps1 -Destination $dest } catch { $blocked = $true }
          if (-not $blocked) { throw 'Existing installation was overwritten' }
      - name: Build reproducible release bundle
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -B scripts/build_release.py --output-dir dist
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: codex-programming-skills
          path: dist/
          if-no-files-found: error
