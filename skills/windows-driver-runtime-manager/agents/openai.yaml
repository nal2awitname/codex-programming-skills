interface:
  display_name: "ตัวจัดการไดรเวอร์และรันไทม์ Windows"
  short_description: "ตรวจระบบ อัปเดตไดรเวอร์จากผู้ผลิตและ WHQL ติดตั้งรันไทม์ผ่านหน้าต่างติ๊กเลือก"
  default_prompt: "ใช้ $windows-driver-runtime-manager ตรวจฮาร์ดแวร์และชุดไดรเวอร์ทั้งหมดของเครื่อง Windows นี้ อัปเดตจากผู้ผลิตก่อน แล้วติดตั้งไดรเวอร์ที่ Microsoft รับรองซึ่งใหม่กว่า พร้อมรันไทม์สำหรับเล่นเกมและทำงานตามลำดับที่ถูกต้อง ทำความสะอาด แสดง log และรายงานความเข้ากันได้"
